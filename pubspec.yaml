name: veyora
description: "Veyora - Your Body. Your Rhythm. Aplikasi pemantau detak jantung dan deteksi stres mahasiswa via smartphone PPG."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  camera: ^0.12.2
  permission_handler: ^11.3.1
  sqflite: ^2.3.3+2
  path: ^1.9.0
  path_provider: ^2.1.4
  fl_chart: ^0.69.2
  intl: ^0.19.0
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
